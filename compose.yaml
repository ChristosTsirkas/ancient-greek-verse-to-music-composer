name: ancient-greek-verse-midi-composer

services:
  app:
    image: ancient-greek-verse-midi-composer:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      # Generated MIDI and MusicXML files survive container replacement.
      - ./downloads:/app/downloads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Reuse the application's established PostgreSQL environment variables.
      # PostgreSQL itself requires POSTGRES_* names, so Compose maps them here.
      POSTGRES_DB: ${PGDATABASE:-postgres}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # PostgreSQL imports this schema only when the named volume is first created.
      - ./shared/database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
